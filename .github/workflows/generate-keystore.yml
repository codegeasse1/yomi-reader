name: Generate signing keystore

on:
  workflow_dispatch:
    inputs:
      storepass:
        description: Keystore store password
        required: true
      keypass:
        description: Key password
        required: true

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Generate keystore
        env:
          SP: ${{ inputs.storepass }}
          KP: ${{ inputs.keypass }}
        run: |
          mkdir -p signing
          keytool -genkeypair -v \
            -keystore signing/yomi-release.keystore \
            -alias yomi \
            -keyalg RSA -keysize 2048 -validity 9125 \
            -storepass "$SP" -keypass "$KP" \
            -dname "CN=Yomi, O=Yomi, C=US"
          printf 'storeFile=signing/yomi-release.keystore\nstorePassword=%s\nkeyAlias=yomi\nkeyPassword=%s\n' "$SP" "$KP" > signing/keystore.properties

      - name: Upload keystore
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-keystore
          path: |
            signing/yomi-release.keystore
            signing/keystore.properties
          if-no-files-found: error
