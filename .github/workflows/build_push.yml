name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Set up signing keystore from secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY secret is not set. Add the base64 keystore to repo Settings > Secrets > Actions."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$SIGNING_KEY" | base64 --decode > signing/yomi-release.keystore
          {
            echo "storePassword=${KEY_STORE_PASSWORD}"
            echo "keyAlias=${ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > signing/keystore.properties
          ls -la signing/

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Verify signing keystore
        run: ./gradlew signingReport --console=plain

      - name: Build app (quick)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleDebug --console=plain

      - name: Upload debug APK
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yomi-debug-arm64-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

      - name: Build app (release for main/tags)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          ./gradlew assembleRelease -Penable-updater --console=plain 2>&1 | tee build_release.log
          python3 tools/ci/report-release-warnings.py build_release.log --enforce

      - name: Upload APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yomi-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-universal-release.apk

      - name: Upload mapping
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release

      - name: Publish GitHub Release with APKs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## What's new

          **☁️ Reliable Cloudflare handling — no more stuck loading**
          When a source is behind a Cloudflare check, the app now shows a verification screen that closes automatically the moment you're verified. No more waiting forever or re-tapping to load pages.

          *(Still included from previous updates: faster chapter loading, auto-retry for failed images, and faster thumbnails.)*

          ## Download
          - **app-arm64-v8a-release.apk** — for most phones (64-bit)
          - **app-universal-release.apk** — works on any phone

          Install the APK and it updates over your existing app — no data lost.
          EOF
          gh release create "${{ github.ref_name }}" \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-universal-release.apk \
            --repo "${{ github.repository }}" \
            --title "Yomi ${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md
